name: Next.js build

on:
  pull_request:
  push:
    branches:
      - main
      - feat/native-home-migration

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run inspect:legacy
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-home-inspection
          path: legacy-inspection
          if-no-files-found: error
      - run: npm run build
