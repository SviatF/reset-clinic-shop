name: Next.js build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Inspect legacy home structure
        run: node scripts/inspect-home.mjs
      - run: npm run build
      - name: Smoke test native storefront routes
        shell: bash
        run: |
          npm start -- -p 3100 > /tmp/reset-shop-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          READY=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/ > /tmp/reset-home.html; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/reset-shop-next.log
            exit 1
          fi

          echo "Checking native React homepage"
          grep -q '/_next/static/' /tmp/reset-home.html || {
            echo "Homepage is not rendering through the Next.js page runtime"
            exit 1
          }
          grep -q 'elementor-page-18287' /tmp/reset-home.html || {
            echo "Homepage lost the archived Elementor body/page classes"
            exit 1
          }

          STYLE_COUNT=$(grep -o '<style' /tmp/reset-home.html | wc -l | tr -d ' ')
          if [ "$STYLE_COUNT" -lt 20 ]; then
            echo "Homepage did not hoist enough archived inline styles: ${STYLE_COUNT}"
            exit 1
          fi

          CSS_PATH=$(grep -oE 'href="[^"]+\.css[^\"]*"' /tmp/reset-home.html | head -1 | cut -d'"' -f2 || true)
          if [[ "$CSS_PATH" == /* ]]; then
            echo "Checking archived CSS asset ${CSS_PATH}"
            curl -fsS "http://127.0.0.1:3100${CSS_PATH}" > /dev/null || {
              cat /tmp/reset-shop-next.log
              exit 1
            }
          else
            echo "Archived homepage styling is inline; no external CSS asset check required"
          fi

          for ROUTE in /category/skincare/ /category/body/ /category/tip-tricks/; do
            echo "Checking native React category ${ROUTE}"
            curl -fsS -D /tmp/reset-category.headers "http://127.0.0.1:3100${ROUTE}" -o /tmp/reset-category.html || {
              cat /tmp/reset-shop-next.log
              exit 1
            }
            grep -q '/_next/static/' /tmp/reset-category.html || {
              echo "Category ${ROUTE} is not rendering through the Next.js page runtime"
              exit 1
            }
            if grep -qi '^x-reset-renderer: next-ssr-fidelity-baseline' /tmp/reset-category.headers; then
              echo "Category ${ROUTE} unexpectedly used the legacy SSR fallback"
              exit 1
            fi
            CATEGORY_STYLE_COUNT=$(grep -o '<style' /tmp/reset-category.html | wc -l | tr -d ' ')
            if [ "$CATEGORY_STYLE_COUNT" -lt 10 ]; then
              echo "Category ${ROUTE} lost archived styling: ${CATEGORY_STYLE_COUNT} styles"
              exit 1
            fi
            grep -qi 'product' /tmp/reset-category.html || {
              echo "Category ${ROUTE} lost its product/catalog markup"
              exit 1
            }
          done

          for ROUTE in /delivery/ /faq/ /calming-face-oil-treatment/; do
            echo "Checking legacy SSR fallback ${ROUTE}"
            curl -fsS -D /tmp/reset-route.headers "http://127.0.0.1:3100${ROUTE}" -o /tmp/reset-route.html || {
              cat /tmp/reset-shop-next.log
              exit 1
            }
            grep -qi '^x-reset-renderer: next-ssr-fidelity-baseline' /tmp/reset-route.headers || {
              echo "Route ${ROUTE} did not use the guarded legacy SSR fallback"
              exit 1
            }
          done

          echo "Checking that archived placeholder products are not published"
          PRODUCT_STATUS=$(curl -sS -o /tmp/reset-placeholder-product.html -w '%{http_code}' \
            http://127.0.0.1:3100/product/squalane-cleanser/)
          if [ "$PRODUCT_STATUS" -ne 404 ]; then
            echo "Archived placeholder product unexpectedly returned HTTP ${PRODUCT_STATUS}"
            exit 1
          fi
