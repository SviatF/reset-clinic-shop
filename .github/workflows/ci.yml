name: Next.js build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Assert native-only source tree
        shell: bash
        run: |
          HTML_FILES=$(find . -path './.git' -prune -o -path './node_modules' -prune -o -type f -name '*.html' -print)
          if [ -n "$HTML_FILES" ]; then
            echo "Raw HTML files are forbidden in the native storefront:"
            echo "$HTML_FILES"
            exit 1
          fi

          if rg -n 'readLegacyDocument|html-react-parser|cheerio|x-reset-renderer|__legacy_asset' app components lib middleware.ts next.config.ts package.json; then
            echo "Legacy HTML runtime reference detected"
            exit 1
          fi
      - run: npm install
      - run: npm run build
      - name: Smoke test native storefront routes
        shell: bash
        run: |
          npm start -- -H 127.0.0.1 -p 3100 > /tmp/reset-shop-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          READY=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/ > /tmp/reset-home.html; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/reset-shop-next.log
            exit 1
          fi

          echo "Checking native React homepage"
          grep -q '/_next/static/' /tmp/reset-home.html || {
            echo "Homepage is not rendering through the Next.js page runtime"
            exit 1
          }
          grep -q 'elementor-page-18287' /tmp/reset-home.html || {
            echo "Homepage lost the approved Elementor design classes"
            exit 1
          }

          grep -q '/native-styles/common.css' /tmp/reset-home.html || {
            echo "Homepage did not load the migrated visual stylesheet"
            exit 1
          }

          curl -fsS http://127.0.0.1:3100/native-styles/common.css > /dev/null

          node -e "const m=require('./content/native/manifest.json'); console.log(Object.keys(m).filter(x=>x!=='/').join('\\n'))" > /tmp/reset-native-routes.txt
          while IFS= read -r ROUTE; do
            echo "Checking native React route ${ROUTE}"
            curl -fsS -D /tmp/reset-route.headers "http://127.0.0.1:3100${ROUTE}" -o /tmp/reset-route.html || {
              cat /tmp/reset-shop-next.log
              exit 1
            }
            grep -q '/_next/static/' /tmp/reset-route.html || {
              echo "Route ${ROUTE} is not rendering through Next.js/React"
              exit 1
            }
            if grep -qi '^x-reset-renderer:' /tmp/reset-route.headers; then
              echo "Route ${ROUTE} exposed a legacy renderer"
              exit 1
            fi
          done < /tmp/reset-native-routes.txt

          for ROUTE in /shop/ /product-category/face/ /product-category/body/ /product-category/hair/ /cart/ /checkout/; do
            echo "Checking native application route ${ROUTE}"
            curl -fsS "http://127.0.0.1:3100${ROUTE}" -o /tmp/reset-app-route.html || {
              cat /tmp/reset-shop-next.log
              exit 1
            }
            grep -q '/_next/static/' /tmp/reset-app-route.html || {
              echo "Application route ${ROUTE} is not native React"
              exit 1
            }
          done

          echo "Checking that archived placeholder products are not published"
          PRODUCT_STATUS=$(curl -sS -o /tmp/reset-placeholder-product.html -w '%{http_code}' \
            http://127.0.0.1:3100/product/squalane-cleanser/)
          if [ "$PRODUCT_STATUS" -ne 404 ]; then
            echo "Archived placeholder product unexpectedly returned HTTP ${PRODUCT_STATUS}"
            exit 1
          fi

          echo "Checking the single structural test product"
          curl -fsS http://127.0.0.1:3100/product/test-product/ -o /tmp/reset-test-product.html
          grep -q 'Тестовий товар' /tmp/reset-test-product.html || {
            echo "Structural test product did not render"
            exit 1
          }
