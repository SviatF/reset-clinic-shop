name: Verify final supplier product photos
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source identity, image MIME and original resolution for each candidate
        run: node scripts/preflight-last-12-media.mjs
