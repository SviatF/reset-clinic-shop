name: Prepare transparent OLIE'RE product cutouts
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install foreground segmentation model and runtime
        run: python -m pip install "rembg[cpu]==2.0.67" "Pillow==11.1.0" "numpy==1.26.4" "scipy==1.14.1" "opencv-python-headless==4.10.0.84"
      - name: Isolate 52 verified products (preserve original supplier images)
        run: python scripts/isolate-oliere-packshots.py --apply
      - name: Verify 52 transparent cutouts
        run: python scripts/isolate-oliere-packshots.py --check
      - name: Refine every cutout with ISNet + U2Net interior protection
        run: python scripts/refine-oliere-cutouts.py --apply
      - name: Check halo-free output and checksums
        run: python scripts/refine-oliere-cutouts.py --check
      - name: Restore untouched official photography for all 14 OLIE'RE kits
        run: node scripts/restore-oliere-bundle-originals.mjs --apply
      - name: Verify complete supplier photo sets were preserved
        run: node scripts/restore-oliere-bundle-originals.mjs --check
      - name: Upload cutout audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oliere-transparent-cutouts-audit
          path: |
            oliere-isolation-report.json
            oliere-clean-matte-report.json
            photo-qa/comparison.jpg
            photo-qa/bundle-comparison-*.jpg
            oliere-bundle-composite-report.json
          if-no-files-found: ignore
      - name: Commit isolated assets to current source branch
        run: |
          git add data/supplier-photo-map.json public/supplier-photos/isolated public/supplier-photos/clean public/supplier-photos/bundles
          if git diff --cached --quiet; then
            echo "No new image outputs"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "assets(shop): prepare transparent packshots for 52 verified OLIE'RE SKUs"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
