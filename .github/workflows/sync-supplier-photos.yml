name: Retrieve verified supplier product photos
on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-supplier-photos.mjs'
      - 'scripts/sync-supplier-workbook-photos.py'
      - 'scripts/normalize-shop-photos.py'
      - 'scripts/mirror-supplier-cdn-photos.mjs'
      - '.github/workflows/sync-supplier-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch supplier photos and save audited matches
        run: node scripts/sync-supplier-photos.mjs --apply
      - name: Mirror 53 existing OLIE'RE product photos to this store
        run: node scripts/mirror-supplier-cdn-photos.mjs --apply
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image compression support
        run: python -m pip install Pillow==11.1.0
      - name: Recover all 39 verified workbook images (Dermafirm and Braderm)
        run: python scripts/sync-supplier-workbook-photos.py --apply
      - name: Normalize all active product photos to consistent transparent studio packshots
        run: python scripts/normalize-shop-photos.py --apply
      - name: Attach full match and error report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supplier-photo-match-report
          path: |
            supplier-photo-sync-report.json
            supplier-cdn-mirror-report.json
            supplier-studio-report.json
          if-no-files-found: ignore
      - name: Commit verified photos to source branch
        run: |
          git add data/supplier-photo-map.json public/supplier-photos
          if git diff --cached --quiet; then
            echo "No new verified product-specific photos"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "assets(shop): store verified supplier photos locally"
          git push origin HEAD:"${GITHUB_REF_NAME}"
