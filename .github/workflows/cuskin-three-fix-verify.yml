name: Verify CU SKIN three photo repairs on live storefront
on:
  push:
    branches: [audit/cuskin-photo-background-20261118]
    paths:
      - '.github/workflows/cuskin-three-fix-verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read current live product images and public sync metrics
        run: |
          node --input-type=module <<'JS'
          const base='https://shop.resetclinic.org';
          for(const page of [1,3,4]){
            const html=await (await fetch(base+'/catalog?brand=CU+SKIN&page='+page)).text();
            const imgs=[...html.matchAll(/<img\s[^>]*>/gi)].map(x=>x[0]);
            const targets=[
              {sku:"300260",name:"CENTECA B5 PAD"},
              {sku:"300257",name:"ENZYME POWDER WASH SACHET"},
              {sku:"300153",name:"VITAMIN U CC CREAM SPF 38"},
            ];
            for(const target of targets){
              const tag=imgs.find(x=>x.toUpperCase().includes(target.name));
              if(!tag)continue;
              const src=tag.match(/src="([^"]+)"/)?.[1]||null;
              const alt=tag.match(/alt="([^"]+)"/)?.[1]||null;
              console.log("CU_REPAIRED_LIVE",JSON.stringify({sku:target.sku,page,src,alt,official:src?.includes("/cu-skin-official/")}));
            }
          }
          const h=await (await fetch(base+'/api/health')).json();
          console.log("CU_REPAIR_HEALTH",JSON.stringify({
            status:h.status,cu_skin:h.photo_health?.cu_skin,sync:h.photo_health?.cu_official_sync
          }));
          JS
