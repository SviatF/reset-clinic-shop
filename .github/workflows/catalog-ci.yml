name: RESET Shop validation
on:
  push:
    branches: [main-SASHA, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate product seeds
        run: node scripts/validate-catalog.mjs
      - name: Validate exact OLIE'RE photo matching
        run: node scripts/validate-oliere-images.mjs
      - name: Verify untouched original photographs for 14 OLIE'RE sets
        run: node scripts/restore-oliere-bundle-originals.mjs --check
      - name: Validate supplier import staging
        run: node scripts/validate-supplier-import.mjs
      - name: Verify high-quality skincare finder imagery
        run: node scripts/validate-skin-concern-assets.mjs
      - name: Verify safe D1 import generator
        run: npm run shop:d1:test
      - name: Test per-product discounts and payable prices
        run: node --experimental-strip-types scripts/test-product-pricing.mjs
      - name: Test scoped bulk promotions and safe writes
        run: node --experimental-strip-types scripts/test-bulk-promotions.mjs
      - name: Validate CU SKIN import and existing product preservation
        run: node --experimental-strip-types scripts/test-cuskin-import.mjs
      - name: Test CU SKIN variant-aware duplicate matching
        run: node --experimental-strip-types scripts/test-cuskin-variants.mjs
      - name: Test bulk publication and photo safeguards
        run: node --experimental-strip-types scripts/test-catalog-publishing.mjs
      - name: Verify official Histolab photo recovery mapping
        run: node --experimental-strip-types scripts/test-histolab-photo-repair.mjs
      - name: Verify specialist subcategories and multi-category product matching
        run: node --experimental-strip-types scripts/test-specialist-categories.mjs
      - name: Validate official multi-brand photo recovery mapping
        run: node --experimental-strip-types scripts/test-verified-supplier-media.mjs
      - name: Verify automatic Cloudflare media job (no manual buttons)
        run: npm run cf:media:test
      - name: Verify official CU SKIN replacement and D1/R2 safeguards
        run: node --test scripts/test-cuskin-official.mjs
      - name: Verify CU SKIN catalog-only publishing with exact SKUs
        run: node --test scripts/test-cuskin-publish.mjs
      - name: Verify CU SKIN stock statuses and order safety
        run: node --experimental-strip-types --test scripts/test-inventory-state.mjs
      - name: Verify safe archival of unidentifiable supplier catalog placeholder
        run: node --test scripts/test-archive-unverifiable-placeholder.mjs
      - name: Verify manufacturer product photo verification for unpublished catalog
        run: node --test scripts/test-verified-supplier-drafts.mjs
      - name: Verify raw D1 photo recovery from catalog's existing local supplier images
        run: node --test scripts/test-local-photo-backfill.mjs
      - name: Build Cloudflare scheduled photo Worker (dry run)
        run: npx wrangler deploy --dry-run --config workers/shop-media-sync/wrangler.jsonc --outdir .tmp/shop-media-cron
      - name: Validate GTM and signed-payment purchase safety
        run: node scripts/verify-gtm-analytics.mjs
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Next.js production build
        run: npm run build
