name: RESET Shop validation
on:
  push:
    branches: [main-SASHA, main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate product seeds
        run: node scripts/validate-catalog.mjs
      - name: Verify safe D1 import generator
        run: npm run shop:d1:test
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Next.js production build
        run: npm run build
