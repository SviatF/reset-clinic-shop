name: Read-only live D1 draft, photo and stock audit
on:
  push:
    branches: [audit/live-draft-inventory-20261118]
    paths:
      - '.github/workflows/audit-live-draft-inventory.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect real Cloudflare health aggregate and CU SKIN public stock labels
        run: |
          node --input-type=module <<'JS'
          const base="https://shop.resetclinic.org";
          const r=await fetch(base+"/api/health",{cache:"no-store",signal:AbortSignal.timeout(18000)});
          const health=await r.json();
          console.log("LIVE_INVENTORY_HEALTH",JSON.stringify({
            http:r.status,status:health.status,products:health.totals?.products,
            photo_health:health.photo_health,inventory_health:health.inventory_health
          }).slice(0,30000));
          let total=0,priceUnknown=0,stockUnknown=0,outOfStock=0,buttons=0;
          for(let page=1;page<=8;page++){
            const response=await fetch(base+"/catalog?brand=CU+SKIN&page="+page,{cache:"no-store",signal:AbortSignal.timeout(16000)});
            const html=await response.text();
            const cards=[...html.matchAll(/<article\s+class="rs-card[^"]*"[^>]*>[\s\S]*?<\/article>/gi)].map(m=>m[0]);
            for(const card of cards){
              total++;
              if(card.includes("Ціна уточнюється"))priceUnknown++;
              if(card.includes("Наявність? ↗")||card.includes("Наявність?"))stockUnknown++;
              if(card.includes("Немає"))outOfStock++;
              if(card.includes("У кошик +"))buttons++;
            }
            console.log("LIVE_CUSKIN_PAGE",JSON.stringify({page,http:response.status,cards:cards.length,
              sample:cards.slice(0,2).map(x=>x.match(/class="rs-card-name"[^>]*>([^<]+)/)?.[1]||"")}));
            if(cards.length<24)break;
          }
          console.log("LIVE_CUSKIN_LABELS",JSON.stringify({total,priceUnknown,stockUnknown,outOfStock,buttons}));
          JS

