name: Audit exact last 12 product photos
on:
  push:
    branches: [feat/finish-remaining-12-draft-images-20261118]
    paths: [.github/workflows/audit-last-12-images.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect source image galleries and health (read only)
        run: |
          node --input-type=module <<'JS'
          const pages=[["source-lip-balm-ukraine","https://sensilis.com.ua/lip-balm/"],["source-pure-age-04","https://sensilis.com.ua/pure-age-perfection-make-up-04/"],["source-pure-age-05","https://sensilis.com.ua/pure-age-perfection-make-up-05/"],["source-upgrade-01","https://sensilis.com.ua/upgrade-make-up-01/"],["source-upgrade-02","https://sensilis.com.ua/upgrade-make-up-02/"],["source-upgrade-03","https://sensilis.com.ua/upgrade-make-up-03/"],["source-hydra-mask","https://sensilis.com/en/skincare/face-masks/hydra-essence-confort-mask"],["source-blackpeel","https://sensilis.com/en/skincare/cleansing-and-exfoliating/revitalising-and-brightening-peel-with-charcoal-blackpeel"],["source-pure-age-official","https://sensilis.com/en/face/makeup/anti-blemish-make-up-pureagemakeup"],["source-upgrade-official","https://sensilis.com/en/face/lifting-effect-make-up-treatment-upgrademakeup"],["source-lipbalm-official","https://sensilis.com/en/skincare/lip-balm/protective-restorative-and-moisturizing-lip-balm-hydraction"],["source-cetaphil","https://avepharm.com.ua/product/cetaphil-micelyarna-emulsiya-dlya-ochishchennya-normalnoji-suhoji-ta-chutlivoji-shkiri-500-ml/"],["source-cu153","https://cu.ua/153"]];
          const out=[];
          let cursor=0;
          async function worker(){
            while(cursor<pages.length){
              const [name,url]=pages[cursor++];
              try {
               const r=await fetch(url,{redirect:"follow",signal:AbortSignal.timeout(17000),headers:{"User-Agent":"Mozilla/5.0","Accept":"text/html"}});
               const html=await r.text(),h1=html.match(/<h1[^>]*>([\s\S]*?)<\/h1>/i)?.[1]?.replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
             const meta=(html.match(/<meta[^>]+>/gi)||[]).filter(x=>/og:image/i.test(x)).map(x=>x.match(/content=["']([^"']+)/i)?.[1]).filter(Boolean);
               const imgs=[...html.matchAll(/<img\b[^>]*>/ig)].map(m=>m[0]).slice(0,60);
               const imgInfo=imgs.map(t=>({alt:t.match(/\balt=["']([^"']+)/i)?.[1]?.slice(0,90),
                 zoom:t.match(/data-zoom-image=["']([^"']+)/i)?.[1],
                 src:t.match(/\b(?:src|data-src)=["']([^"']+)/i)?.[1]})).filter(o=>o.zoom||/sensilis|cetaphil|cu|skin|lip|mascara|make|retin|black|peel|confort/i.test((o.alt||"")+" "+(o.src||""))).slice(0,16);
               const urls=[...new Set([...html.matchAll(/(?:(?:https?:)?\/\/)?[^"'\s<>]+(?:\.png|\.jpg|\.webp)(?:\?[^"'\s<>]*)?/gi)].map(x=>x[0]).filter(x=>/04|05|02|03|UPGRADE|PUREAGE|RESURF|HYDRA/i.test(x)))].slice(0,25);
               const item={name,status:r.status,final:r.url,bytes:html.length,title:html.match(/<title[^>]*>([^<]+)/i)?.[1],h1,meta,imgs:imgInfo,relatedImages:urls};
               console.log("PHOTO_SOURCE_AUDIT",JSON.stringify(item).slice(0,5500));
               out.push(item);
              }catch(e){console.log("PHOTO_SOURCE_AUDIT",JSON.stringify({name,error:String(e)}))}
            }
          }
          await Promise.all([worker(),worker(),worker()]);
          const r=await fetch("https://shop.resetclinic.org/api/health",{cache:"no-store"});
          const h=await r.json();
          console.log("PHOTO_LIVE_STATE",JSON.stringify({status:h.status,inventory:h.inventory_health,verified:h.photo_health?.verified_draft_sync,cu:h.photo_health?.cu_skin}).slice(0,12000));

          // Additional exact product pages and source-image validation.
          const extra=[
            ["hydra-karvatska","https://karvatska.store/hydra-essence-confort-mask/"],
            ["hydra-shampoo","https://shampoomarket.com.ua/uk/sensilis-hydra-essence-confort-mask-ultra-uvlazhnyayushhaya-maska-dlya-licza-150-ml"],
            ["sensilis-pure04","https://sensilis.com.ua/pure-age-perfection-make-up-04/"],
            ["cu-137","https://cu.ua/137"],
            ["cu-149","https://cu.ua/149"]
          ];
          for(const [name,url] of extra){
           try{
             const r=await fetch(url,{redirect:"follow",signal:AbortSignal.timeout(12000),headers:{"User-Agent":"Mozilla/5.0"}});
             const html=await r.text();
             const h1=html.match(new RegExp("<h1[^>]*>(.*?)</h1>","is"))?.[1]?.replace(/<[^>]+>/g," ").trim();
             const meta=(html.match(/<meta[^>]+>/gi)||[]).filter(x=>/og:image/i.test(x)).map(x=>x.match(/content=["']([^"']+)/i)?.[1]).filter(Boolean);
             console.log("EXTRA_SOURCE",JSON.stringify({name,status:r.status,h1,meta,title:html.match(/<title[^>]*>([^<]+)/i)?.[1],size:html.length}).slice(0,1200));
           }catch(e){console.log("EXTRA_SOURCE",JSON.stringify({name,error:String(e)}))}
          }
          const media=[
            ["mask-aesthetic","https://storage.googleapis.com/atoday-cdn/uploads/product/01/26/WjVPWThMb0pFdGVN-large.jpg"],
            ["cetaphil500","https://avepharm.com.ua/storage/8705/conversions/4-preview.jpg?v=1795021016"],
            ["cu-vitamin","https://key.cu.ua/src/media/470_470_2.png"],
            ["cu-aftercream","https://key.cu.ua/src/media/470_470_CP6vIqq.png"],
            ["cu-sunscreen","https://key.cu.ua/src/media/470_470_djVJtQv.png"],
            ["sensilis-pure05","https://sensilis.com.ua/image/cache/catalog/products/Products/MAKE-UP/Pure-Age-Perfection/05-750x1000.png"],
            ["sensilis-pure01","https://sensilis.com.ua/image/cache/catalog/products/Products/MAKE-UP/Pure-Age-Perfection/01-750x1000.png"],
            ["sensilis-blackpeel","https://sensilis.com/uploaded/products/BLACKPEEL_PDR.png"],
            ["sensilis-lipbalm","https://sensilis.com/uploaded/products/HYDRACTION_PDR.png"]
          ];
          for(const [name,url] of media){
           try {
            const r=await fetch(url,{signal:AbortSignal.timeout(12000)});
            const b=new Uint8Array(await r.arrayBuffer());
            let dims="";
            if(b[0]===137&&b[1]===80&&b[2]===78&&b[3]===71){
             const v=new DataView(b.buffer);dims=v.getUint32(16)+"x"+v.getUint32(20);
            }else if(b[0]===255&&b[1]===216){
             for(let i=2;i<b.length-10;){
              if(b[i]!==255){i++;continue}
              const marker=b[i+1],len=(b[i+2]<<8)+b[i+3];
              if([192,193,194,195,198,199,201,202].includes(marker)){dims=((b[i+7]<<8)+b[i+8])+"x"+((b[i+5]<<8)+b[i+6]);break}
              i+=2+(len||2);
             }
            }
            console.log("PHOTO_DIM",JSON.stringify({name,status:r.status,mime:r.headers.get("content-type"),bytes:b.byteLength,dims,url}).slice(0,650));
           }catch(e){console.log("PHOTO_DIM",JSON.stringify({name,error:String(e)}))}
          }

          for(const [name,url] of [
           ["hydrakarvatska","https://karvatska.store/hydra-essence-confort-mask/"],
           ["cetavepharm","https://avepharm.com.ua/product/cetaphil-micelyarna-emulsiya-dlya-ochishchennya-normalnoji-suhoji-ta-chutlivoji-shkiri-500-ml/"]
          ]){
            try{
             const html=await (await fetch(url,{signal:AbortSignal.timeout(13000)})).text();
             const imgTags=[...html.matchAll(/<img[^>]*>/gi)].map(m=>m[0]);
             const urls=[...new Set([...html.matchAll(/https?:\/\/[^"' <>]+(?:jpg|png|webp)(?:\?[^"' <>]*)?/gi)].map(x=>x[0]))].filter(u=>/hydra|confort|mask|sensilis|storage\/8705|Cetaphil|cetaphil/i.test(u)).slice(0,25);
             const hit=imgTags.filter(x=>/hydra|mask|confort|storage\/8705|main-image|product-image|Cetaphil/i.test(x)).slice(0,16);
             console.log("PRODUCT_GALLERY",JSON.stringify({name,urls,tags:hit.map(x=>x.slice(0,650))}).slice(0,11500));
            }catch(e){console.log("PRODUCT_GALLERY",JSON.stringify({name,error:String(e)}))}
          }
          for(const [name,url] of [
           ["cet-previewweb","https://avepharm.com.ua/storage/8705/conversions/4-preview_web.webp"],
           ["cet-originaljpg","https://avepharm.com.ua/storage/8705/4.jpg"],
           ["cet-originalpng","https://avepharm.com.ua/storage/8705/4.png"],
           ["cet-originalwebp","https://avepharm.com.ua/storage/8705/4.webp"],
           ["cet-mainwebp","https://avepharm.com.ua/storage/8705/conversions/4-preview_web.webp?v=1795021016"],
           ["cet-thumbwebp","https://avepharm.com.ua/storage/8705/conversions/4-thumb-p.webp"]
          ]){
            try{
             const r=await fetch(url,{signal:AbortSignal.timeout(9000)});
             const b=new Uint8Array(await r.arrayBuffer()),dv=new DataView(b.buffer);
             let dims="";
             if(b[0]===137&&b[1]===80) dims=dv.getUint32(16)+"x"+dv.getUint32(20);
             if(b[0]===82&&b[1]===73&&b[2]===70&&b[3]===70&&b[12]===86&&b[13]===80&&b[14]===56&&b[15]===88){
                const width=1+b[24]+(b[25]<<8)+(b[26]<<16),height=1+b[27]+(b[28]<<8)+(b[29]<<16);dims=width+"x"+height;
             }
             console.log("SUPPLIER_PHOTO_SIZE",JSON.stringify({name,status:r.status,mime:r.headers.get("content-type"),size:b.length,dims}));
            }catch(e){console.log("SUPPLIER_PHOTO_SIZE",JSON.stringify({name,error:String(e)}))}
          }
          JS
