name: Verify exact OLIE'RE product photography
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and download every exact official product photo
        run: node scripts/sync-oliere-exact-photos.mjs --apply
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image normalization engine
        run: python -m pip install "rembg[cpu]==2.0.67" "Pillow==11.1.0" "numpy==1.26.4" "scipy==1.14.1" "opencv-python-headless==4.10.0.84"
      - name: Prepare consistent catalog studio images
        run: python scripts/normalize-shop-photos.py --apply
      - name: Remove photographic backdrops from each verified OLIE'RE product image
        run: python scripts/isolate-oliere-packshots.py --apply
      - name: Verify preserved alpha channels
        run: python scripts/isolate-oliere-packshots.py --check
      - name: Upgrade package cutouts with clean masks and logo protection
        run: python scripts/refine-oliere-cutouts.py --apply
      - name: Verify clean transparent product images
        run: python scripts/refine-oliere-cutouts.py --check
      - name: Compose verified OLIE'RE kits without photographic scene shadows
        run: python scripts/render-oliere-bundles.py --apply
      - name: Verify 14 exact bundle composites and SKU constituents
        run: python scripts/render-oliere-bundles.py --check
      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-oliere-photo-matches
          path: |
            oliere-exact-photo-report.json
            supplier-studio-report.json
            oliere-isolation-report.json
            oliere-clean-matte-report.json
            photo-qa/comparison.jpg
            photo-qa/bundle-comparison-*.jpg
            oliere-bundle-composite-report.json
          if-no-files-found: ignore
      - name: Commit only verified photos and media mapping
        run: |
          git add data/supplier-photo-map.json public/supplier-photos/oliere-exact public/supplier-photos/studio public/supplier-photos/isolated public/supplier-photos/clean public/supplier-photos/bundles
          if git diff --cached --quiet; then
            echo "No changes in supplier photos"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "assets(shop): verify OLIE'RE product-specific photos against official storefront"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
