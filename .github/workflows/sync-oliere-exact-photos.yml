name: Verify exact OLIE'RE product photography
on:
  push:
    branches: [fix/oliere-exact-product-images-20261114]
    paths:
      - 'scripts/sync-oliere-exact-photos.mjs'
      - '.github/workflows/sync-oliere-exact-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and download every exact official product photo
        run: node scripts/sync-oliere-exact-photos.mjs --apply
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image normalization engine
        run: python -m pip install Pillow==11.1.0
      - name: Prepare consistent catalog studio images
        run: python scripts/normalize-shop-photos.py --apply
      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-oliere-photo-matches
          path: |
            oliere-exact-photo-report.json
            supplier-studio-report.json
          if-no-files-found: ignore
      - name: Commit only verified photos and media mapping
        run: |
          git add data/supplier-photo-map.json public/supplier-photos/oliere-exact public/supplier-photos/studio
          if git diff --cached --quiet; then
            echo "No changes in supplier photos"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "assets(shop): verify OLIE'RE product-specific photos against official storefront"
          git push origin HEAD:fix/oliere-exact-product-images-20261114
