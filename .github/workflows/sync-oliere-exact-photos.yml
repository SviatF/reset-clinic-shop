name: Verify exact OLIE'RE product photography
on:
  push:
    branches: [fix/oliere-exact-product-images-20261114]
    paths:
      - 'scripts/sync-oliere-exact-photos.mjs'
      - '.github/workflows/sync-oliere-exact-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact titles against official public Shopify products
        run: node scripts/sync-oliere-exact-photos.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-oliere-photo-matches
          path: oliere-exact-photo-report.json
          if-no-files-found: ignore
