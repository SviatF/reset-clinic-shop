name: Audit RESET Shop photos in Cloudflare D1
on:
  push:
    branches: [feat/shop-media-readonly-audit-20261117]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate existing Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install CLI
        run: npm install --no-audit --no-fund
      - name: Read-only inventory of image URLs by brand (live D1)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute reset-clinic-shop-db --remote --command           "SELECT json_extract(j.value,'$.brand') AS brand, COUNT(*) AS products, SUM(CASE WHEN COALESCE(json_extract(j.value,'$.image_url'),'')='' THEN 1 ELSE 0 END) AS without_photo, SUM(CASE WHEN COALESCE(json_extract(j.value,'$.image_url'),'') LIKE '%/official-auto/%' THEN 1 ELSE 0 END) AS cron_photo FROM shop_documents d, json_each(d.content) j WHERE d.pathname='data/products.json' GROUP BY brand ORDER BY without_photo DESC, products DESC;"
      - name: Read-only auto-media sync status (live D1)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute reset-clinic-shop-db --remote --command           "SELECT status, COUNT(*) AS attempts, MAX(checked_at) AS latest_checked_at FROM shop_media_sync_attempts GROUP BY status ORDER BY attempts DESC;" || echo "Cron attempt table not yet created or cannot be read."
      - name: Show non-sensitive results location
        run: |
          echo "## RESET Shop media audit" >> "$GITHUB_STEP_SUMMARY"
          echo "Consult the two read-only D1 query step logs for actual live catalog counts and Cron status. No rows were modified by this workflow." >> "$GITHUB_STEP_SUMMARY"
