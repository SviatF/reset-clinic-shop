name: Restore original OLIE'RE kit photographs
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use full official kit photos with their own uncut studio backgrounds
        run: node scripts/restore-oliere-bundle-originals.mjs --apply
      - name: Verify 14 source images, checksums and mappings
        run: node scripts/restore-oliere-bundle-originals.mjs --check
      - name: Publish the mapping if a manual restore changed it
        run: |
          git add data/supplier-photo-map.json
          if git diff --cached --quiet; then
            echo "All kit photos already original"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "assets(shop): restore untouched supplier photos for OLIE'RE sets"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
